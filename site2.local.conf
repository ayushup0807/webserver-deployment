<VirtualHost *:80>
  ServerName site2.local
  DocumentRoot /var/www/site2.local/html
  SSLEngine on
  SSLCertificateFile /etc/pki/tls/certs/site2.local.crt
  SSLCertificateKeyFile /etc/pki/tls/private/site2.local.key
  ErrorLog /var/log/httpd/site2_error.log
  CustomLog /var/log/httpd/site2_access.log combined
</VirtualHost>
